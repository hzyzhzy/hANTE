name: Build Universal

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11

      - name: Check Architectury Maven
        run: |
          curl -sSI --max-time 20 \
            https://maven.architectury.dev/architectury-plugin/architectury-plugin.gradle.plugin/3.4.160/architectury-plugin.gradle.plugin-3.4.160.pom \
            | head -n 5 || true

      - name: Clear stale Gradle module cache
        run: rm -rf ~/.gradle/caches/modules-2

      - name: Build 1.20.1 universal jar
        run: gradle setupLibrary build mergeJars -PbuildVersion=1.20.1 --no-daemon

      - name: Prepare universal artifact
        run: |
          MOD_VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
          SRC=$(find build -maxdepth 2 -type f -name 'MTR-ANTE-*.jar' | head -n 1)
          if [ -z "$SRC" ]; then
            echo "No merged jar found under build/"
            find build -maxdepth 2 -type f -name '*.jar' -print
            exit 1
          fi
          DST="build/MTR-hANTE-${MOD_VERSION}+1.20.1-universal.jar"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTR-hANTE-universal
          path: build/MTR-hANTE-*-universal.jar
          compression-level: 9
